<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House Fellowship Leadership Program Application</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-emerald-50/50 min-h-screen py-10 px-4 sm:px-6">

  <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md border border-emerald-100 overflow-hidden">
    <div class="bg-emerald-800 text-white p-6 sm:p-8 text-center border-b-4 border-emerald-600">
      <h1 class="text-xl sm:text-2xl font-bold tracking-wide uppercase">
        House Fellowship Leadership Program Application E-Form
      </h1>
      <p class="text-emerald-100 text-sm mt-2 font-medium">
        Please fill out all required fields accurately.
      </p>
    </div>

    <form class="p-6 sm:p-8 space-y-6" onsubmit="event.preventDefault();">
      
      <div>
        <h2 class="text-lg font-semibold text-emerald-900 border-b-2 border-emerald-200 pb-2 mb-4">
          Personal Details
        </h2>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
            <input type="text" placeholder="John Doe" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 outline-none text-sm transition">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email Address *</label>
            <input type="email" placeholder="example@gmail.com" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 outline-none text-sm transition">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number *</label>
            <input type="tel" placeholder="+234..." required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 outline-none text-sm transition">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Residential Address *</label>
            <input type="text" placeholder="Address..." required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 outline-none text-sm transition">
          </div>
        </div>
      </div>

      <div id="additional-questions" class="border-2 border-dashed border-emerald-200 rounded-lg p-6 text-center text-gray-500 bg-emerald-50/30">
        <p class="text-sm font-medium text-emerald-800">Ready for your questions...</p>
        <p class="text-xs text-gray-500 mt-1">Send over the rest of the form fields and I will build them straight into this layout.</p>
      </div>

      <div class="pt-4">
        <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-3 px-6 rounded-md transition duration-200 shadow hover:shadow-md">
          Submit Application
        </button>
      </div>

    </form>
  </div>

</body>
</html>
